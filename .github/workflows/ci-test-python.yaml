name: CI test python

on:
  workflow_call:
    inputs:
      package:
        description: Importable package name, used for the coverage report.
        required: true
        type: string
      python-versions:
        description: JSON array of Python versions to test.
        type: string
        default: '["3.12", "3.13", "3.14"]'
      os:
        description: JSON array of runner labels to test on.
        type: string
        default: '["ubuntu-24.04"]'
      extras:
        description: Optional-dependency group that installs the test requirements.
        type: string
        default: testing
      test-path:
        description: Path passed to pytest.
        type: string
        default: tests
      pre-test-command:
        description: Shell commands run in the same step as pytest, for example downloading data or exporting environment variables.
        type: string
        default: ""
      coverage:
        description: Upload a coverage report to Coveralls.
        type: boolean
        default: true
      coverage-python-version:
        description: Python version used for the coverage job.
        type: string
        default: "3.14"
      coverage-flag:
        description: >-
          Name for this coverage report. When set, it is uploaded as a named
          parallel build and the caller must close it with ci-coveralls-finish.
          Leave empty for a single, self-contained report.
        type: string
        default: ""
      timeout-minutes:
        description: Timeout for each job.
        type: number
        default: 25

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
        python-version: ${{ fromJSON(inputs.python-versions) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        shell: bash
        env:
          EXTRAS: ${{ inputs.extras }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[${EXTRAS}]"

      - name: Run tests
        shell: bash
        env:
          TEST_PATH: ${{ inputs.test-path }}
          PRE_TEST_COMMAND: ${{ inputs.pre-test-command }}
        run: |
          if [ -n "${PRE_TEST_COMMAND}" ]; then
            eval "${PRE_TEST_COMMAND}"
          fi

          python -m pytest "${TEST_PATH}"

  coverage:
    name: Coverage
    if: inputs.coverage
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      checks: write
      statuses: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ inputs.coverage-python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.coverage-python-version }}

      - name: Install test dependencies
        env:
          EXTRAS: ${{ inputs.extras }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[${EXTRAS}]"

      - name: Run tests with coverage
        env:
          PACKAGE: ${{ inputs.package }}
          TEST_PATH: ${{ inputs.test-path }}
          PRE_TEST_COMMAND: ${{ inputs.pre-test-command }}
        run: |
          if [ -n "${PRE_TEST_COMMAND}" ]; then
            eval "${PRE_TEST_COMMAND}"
          fi

          python -m pytest "${TEST_PATH}" \
            --cov "${PACKAGE}" \
            --cov-report term-missing \
            --cov-report xml \
            -q

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ github.token }}
          file: coverage.xml
          flag-name: ${{ inputs.coverage-flag }}
          parallel: ${{ inputs.coverage-flag != '' }}
          fail-on-error: false
