name: CI test python

on:
  workflow_call:
    inputs:
      package:
        description: Importable package name, used for the coverage report.
        required: true
        type: string
      python-versions:
        description: JSON array of Python versions to test.
        type: string
        default: '["3.12", "3.13", "3.14"]'
      os:
        description: JSON array of runner labels to test on.
        type: string
        default: '["ubuntu-26.04"]'
      extras:
        description: Optional-dependency group that installs the test requirements.
        type: string
        default: testing
      test-path:
        description: Path passed to pytest.
        type: string
        default: tests
      pre-test-command:
        description: Shell commands run in the same step as pytest, for example downloading data or exporting environment variables.
        type: string
        default: ""
      lowest-dependencies-check:
        description: >-
          After the normal tests, reinstall the lowest versions of the direct
          dependencies that pyproject.toml allows and run the tests again in the
          same job, to check the declared floors. Coverage is not measured in
          this second run.
        type: boolean
        default: false
      coverage:
        description: >-
          Measure coverage on one leg, the first runner in os on the
          coverage-python-version leg, and upload the report to Coveralls from a
          separate Coverage job.
        type: boolean
        default: true
      coverage-python-version:
        description: >-
          Python version whose leg measures coverage. When it is not one of
          python-versions, the first entry of python-versions is used instead.
        type: string
        default: "3.14"
      coverage-flag:
        description: >-
          Name for this coverage report. When set, it is uploaded as a named
          parallel build and the caller must close it with ci-coveralls-finish.
          Leave empty for a single, self-contained report. A caller that runs
          this workflow from a matrix sets a different flag for each leg.
        type: string
        default: ""
      timeout-minutes:
        description: Timeout for each job.
        type: number
        default: 25

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      checks: write
      statuses: write
    defaults:
      run:
        shell: bash
    env:
      COVERAGE_LEG: ${{ inputs.coverage && matrix.python-version == (contains(fromJSON(inputs.python-versions), inputs.coverage-python-version) && inputs.coverage-python-version || fromJSON(inputs.python-versions)[0]) && matrix.os == fromJSON(inputs.os)[0] }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
        python-version: ${{ fromJSON(inputs.python-versions) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        env:
          EXTRAS: ${{ inputs.extras }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[${EXTRAS}]"

      - name: Run tests
        env:
          PACKAGE: ${{ inputs.package }}
          TEST_PATH: ${{ inputs.test-path }}
          PRE_TEST_COMMAND: ${{ inputs.pre-test-command }}
        run: |
          if [ -n "${PRE_TEST_COMMAND}" ]; then
            eval "${PRE_TEST_COMMAND}"
          fi

          cov_args=()
          if [ "${COVERAGE_LEG}" = "true" ]; then
            cov_args=(--cov "${PACKAGE}" --cov-report term-missing --cov-report xml)
          fi
          python -m pytest "${cov_args[@]}" "${TEST_PATH}"

      - name: Save the coverage report
        if: env.COVERAGE_LEG == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ inputs.package }}${{ inputs.coverage-flag != '' && format('-{0}', inputs.coverage-flag) || '' }}
          path: coverage.xml

      - name: Install the lowest dependencies
        if: inputs.lowest-dependencies-check
        env:
          EXTRAS: ${{ inputs.extras }}
        run: |
          python -m pip install uv==0.13.3
          uv pip install --system --reinstall --resolution lowest-direct -e ".[${EXTRAS}]"

      - name: Run tests at the lowest dependencies
        if: inputs.lowest-dependencies-check
        env:
          TEST_PATH: ${{ inputs.test-path }}
          PRE_TEST_COMMAND: ${{ inputs.pre-test-command }}
        run: |
          if [ -n "${PRE_TEST_COMMAND}" ]; then
            eval "${PRE_TEST_COMMAND}"
          fi

          python -m pytest "${TEST_PATH}"

  coverage:
    name: Coverage
    if: inputs.coverage
    needs: test
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      statuses: write

    steps:
      - name: Get the coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-${{ inputs.package }}${{ inputs.coverage-flag != '' && format('-{0}', inputs.coverage-flag) || '' }}

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ github.token }}
          file: coverage.xml
          flag-name: ${{ inputs.coverage-flag }}
          parallel: ${{ inputs.coverage-flag != '' }}
          fail-on-error: false
