name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, in X.Y.Z form.
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    uses: ./.github/workflows/release-prepare.yaml
    permissions:
      contents: write
      pull-requests: write
    with:
      version: ${{ inputs.version }}
    # Zulip release announcements are disabled until 1.0.0.
