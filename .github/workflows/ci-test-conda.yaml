name: CI test conda

on:
  workflow_call:
    inputs:
      package:
        description: Importable package name, used for the coverage report.
        required: true
        type: string
      python-versions:
        description: JSON array of Python versions to test.
        type: string
        default: '["3.12", "3.13", "3.14"]'
      os:
        description: JSON array of runner labels to test on.
        type: string
        default: '["ubuntu-26.04"]'
      conda-packages:
        description: >-
          Space-separated conda package specs to install on top of Python, for
          example "aiida-core=2.9.1 ambertools=24". The Python version of each
          leg is pinned for you. A caller that needs several versions of a
          package runs this workflow from a job with its own strategy matrix.
        type: string
        default: ""
      environment-file:
        description: Conda environment file used to create the environment. Leave empty to create an empty environment.
        type: string
        default: ""
      activate-environment:
        description: Name of the conda environment. It must match the name inside the environment file, if one is used.
        type: string
        default: testing
      channels:
        description: Comma-separated conda channels, in priority order.
        type: string
        default: conda-forge
      extras:
        description: Optional-dependency group installed with the package. Leave empty to install the package alone.
        type: string
        default: testing
      pip-packages:
        description: Space-separated extra packages to install with pip.
        type: string
        default: ""
      lowest-dependencies-check:
        description: >-
          After the normal tests, reinstall the lowest versions of the direct
          dependencies that pyproject.toml allows and run the tests again in the
          same job, to check the declared floors. Coverage is not measured in
          this second run.
        type: boolean
        default: false
      pre-test-command:
        description: Shell commands run in the same step as pytest, for example exporting environment variables.
        type: string
        default: ""
      pytest-args:
        description: Extra arguments passed to pytest.
        type: string
        default: ""
      test-path:
        description: Path passed to pytest.
        type: string
        default: tests
      coverage:
        description: >-
          Measure coverage on every leg and upload one report to Coveralls, from
          the first runner in os on the coverage-python-version leg.
        type: boolean
        default: false
      coverage-python-version:
        description: Python version whose leg uploads the coverage report. It must be one of python-versions.
        type: string
        default: "3.14"
      coverage-flag:
        description: >-
          Name for this coverage report. When set, it is uploaded as a named
          parallel build and the caller must close it with ci-coveralls-finish.
          Leave empty for a single, self-contained report.
        type: string
        default: ""
      timeout-minutes:
        description: Timeout for each job.
        type: number
        default: 30

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      checks: write
      statuses: write
    defaults:
      run:
        shell: bash -el {0}
    env:
      COVERAGE_LEG: ${{ inputs.coverage && matrix.python-version == inputs.coverage-python-version && matrix.os == fromJSON(inputs.os)[0] }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
        python-version: ${{ fromJSON(inputs.python-versions) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          miniforge-variant: Miniforge3
          python-version: ${{ matrix.python-version }}
          environment-file: ${{ inputs.environment-file }}
          activate-environment: ${{ inputs.activate-environment }}
          channels: ${{ inputs.channels }}
          auto-activate: false

      - name: Install conda packages
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          PACKAGES: ${{ inputs.conda-packages }}
          CHANNELS: ${{ inputs.channels }}
        run: |
          channel_args=()
          IFS=',' read -ra channel_list <<< "${CHANNELS}"
          for channel in "${channel_list[@]}"; do
            channel_args+=(-c "${channel}")
          done

          read -r -a package_list <<< "${PACKAGES}"
          if [ "${#package_list[@]}" -gt 0 ]; then
            conda install -y "${channel_args[@]}" "python=${PYTHON_VERSION}" "${package_list[@]}"
          fi

      - name: Install the package
        env:
          EXTRAS: ${{ inputs.extras }}
          PIP_PACKAGES: ${{ inputs.pip-packages }}
        run: |
          if [ -n "${EXTRAS}" ]; then
            python -m pip install -e ".[${EXTRAS}]"
          else
            python -m pip install -e .
          fi

          read -r -a pip_list <<< "${PIP_PACKAGES}"
          if [ "${#pip_list[@]}" -gt 0 ]; then
            python -m pip install "${pip_list[@]}"
          fi

      - name: Run tests
        env:
          PACKAGE: ${{ inputs.package }}
          TEST_PATH: ${{ inputs.test-path }}
          PYTEST_ARGS: ${{ inputs.pytest-args }}
          PRE_TEST_COMMAND: ${{ inputs.pre-test-command }}
        run: |
          if [ -n "${PRE_TEST_COMMAND}" ]; then
            eval "${PRE_TEST_COMMAND}"
          fi

          read -r -a extra_args <<< "${PYTEST_ARGS}"
          cov_args=()
          if [ "${COVERAGE_LEG}" = "true" ]; then
            cov_args=(--cov "${PACKAGE}" --cov-report term-missing --cov-report "xml:${GITHUB_WORKSPACE}/coverage.xml")
          fi
          python -m pytest "${extra_args[@]}" "${cov_args[@]}" "${TEST_PATH}"

      - name: Save the coverage report
        if: env.COVERAGE_LEG == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ inputs.package }}
          path: ${{ github.workspace }}/coverage.xml

      - name: Install the lowest dependencies
        if: inputs.lowest-dependencies-check
        env:
          EXTRAS: ${{ inputs.extras }}
        run: |
          python -m pip install uv==0.13.3
          install=(uv pip install --python "$(command -v python)" --reinstall --resolution lowest-direct)

          if [ -n "${EXTRAS}" ]; then
            "${install[@]}" -e ".[${EXTRAS}]"
          else
            "${install[@]}" -e .
          fi

      - name: Run tests at the lowest dependencies
        if: inputs.lowest-dependencies-check
        env:
          TEST_PATH: ${{ inputs.test-path }}
          PYTEST_ARGS: ${{ inputs.pytest-args }}
          PRE_TEST_COMMAND: ${{ inputs.pre-test-command }}
        run: |
          if [ -n "${PRE_TEST_COMMAND}" ]; then
            eval "${PRE_TEST_COMMAND}"
          fi

          read -r -a extra_args <<< "${PYTEST_ARGS}"
          python -m pytest "${extra_args[@]}" "${TEST_PATH}"

  coverage:
    name: Coverage
    if: inputs.coverage
    needs: test
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      statuses: write

    steps:
      - name: Get the coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-${{ inputs.package }}

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ github.token }}
          file: coverage.xml
          format: cobertura
          flag-name: ${{ inputs.coverage-flag }}
          parallel: ${{ inputs.coverage-flag != '' }}
          fail-on-error: false
