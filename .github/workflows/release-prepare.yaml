name: Release prepare

on:
  workflow_call:
    inputs:
      version:
        description: Version to release, in X.Y.Z form.
        required: true
        type: string
      version-files:
        description: >-
          JSON array of files that hold the version. Each entry has a path, a
          regular expression pattern matched against each line, and a replace
          string. {version} and {date} are available in the replace string.
          Use an empty array when no files hold the version.
        type: string
        default: "[]"
      base-branch:
        description: Branch that is released.
        type: string
        default: main
      timeout-minutes:
        description: Timeout for each job.
        type: number
        default: 45
    secrets:
      AUTO_PR_MERGE:
        description: Token used to approve the version bump pull request. Required when version-files is not empty.
        required: false
      # Zulip release announcements are disabled until 1.0.0.
      # ZULIP_BOT_EMAIL:
      #   required: false
      # ZULIP_BOT_API_KEY:
      #   required: false
      # ZULIP_SITE:
      #   required: false
    outputs:
      tag:
        description: The tag that was created.
        value: ${{ jobs.tag.outputs.tag }}
      commit:
        description: The commit that was tagged.
        value: ${{ jobs.tag.outputs.commit }}

permissions:
  contents: read

jobs:
  checks:
    name: Version check
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base-branch }}
          fetch-depth: 0

      - name: Check version is new and greater than the latest tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be in X.Y.Z form, got '${VERSION}'"
            exit 1
          fi

          latest=$(git tag --list | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -z "${latest}" ]; then
            echo "No existing release tags found, accepting ${VERSION}"
            exit 0
          fi

          highest=$(printf '%s\n%s\n' "${latest}" "${VERSION}" | sort -V | tail -n 1)
          if [ "${VERSION}" = "${latest}" ] || [ "${highest}" != "${VERSION}" ]; then
            echo "::error::Version ${VERSION} must be greater than the latest release ${latest}"
            exit 1
          fi

          echo "Version check passed: ${latest} -> ${VERSION}"

  version:
    name: Prepare ${{ inputs.version }}
    needs: checks
    if: inputs.version-files != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: write
      pull-requests: write
    outputs:
      commit: ${{ steps.merge.outputs.commit }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base-branch }}

      - name: Update version files
        env:
          VERSION: ${{ inputs.version }}
          VERSION_FILES: ${{ inputs.version-files }}
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import re
          import sys

          version = os.environ["VERSION"]
          date = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d")

          for entry in json.loads(os.environ["VERSION_FILES"]):
              path = entry["path"]
              pattern = re.compile(entry["pattern"], re.MULTILINE)
              replacement = entry["replace"].replace("{version}", version).replace("{date}", date)
              with open(path, encoding="utf-8") as handle:
                  text = handle.read()
              updated, count = pattern.subn(lambda match: replacement, text)
              if count == 0:
                  sys.exit(f"::error::{path}: pattern {entry['pattern']!r} did not match")
              with open(path, "w", encoding="utf-8") as handle:
                  handle.write(updated)
              print(f"Updated {path} ({count} match(es))")
          PY

      - name: Open version pull request
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: Update version to ${{ inputs.version }}
          branch: version-update
          title: "Update to version ${{ inputs.version }}"
          body: |
            Update version files for release ${{ inputs.version }}.
            Auto-generated by the release workflow.
          committer: version-updater <vu.bot@users.noreply.github.com>
          author: version-updater <vu.bot@users.noreply.github.com>
          base: ${{ inputs.base-branch }}
          signoff: false
          draft: false

      - name: Approve version pull request
        uses: hmarr/auto-approve-action@f0939ea97e9205ef24d872e76833fa908a770363 # v4.0.0
        with:
          pull-request-number: ${{ steps.pr.outputs.pull-request-number }}
          review-message: "Auto approved version bump PR"
          github-token: ${{ secrets.AUTO_PR_MERGE }}

      - name: Merge version pull request and wait for the merge
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          if [ -z "${PR_NUMBER}" ]; then
            echo "::error::No version pull request was created, are the version files already up to date?"
            exit 1
          fi

          gh pr merge --merge --delete-branch --auto "${PR_NUMBER}"

          for _ in $(seq 1 180); do
            state=$(gh pr view "${PR_NUMBER}" --json state --jq '.state')
            if [ "${state}" = "MERGED" ]; then
              commit=$(gh pr view "${PR_NUMBER}" --json mergeCommit --jq '.mergeCommit.oid')
              echo "commit=${commit}" >> "$GITHUB_OUTPUT"
              echo "Version pull request #${PR_NUMBER} merged as ${commit}"
              exit 0
            fi
            if [ "${state}" = "CLOSED" ]; then
              echo "::error::Version pull request #${PR_NUMBER} was closed without merging"
              exit 1
            fi
            sleep 10
          done

          echo "::error::Timed out waiting for version pull request #${PR_NUMBER} to merge"
          exit 1

  tag:
    name: Tag ${{ inputs.version }}
    needs: [checks, version]
    if: >-
      always() &&
      needs.checks.result == 'success' &&
      (needs.version.result == 'success' || needs.version.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.tag.outputs.commit }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base-branch }}
          fetch-depth: 0

      - name: Create and push tag
        id: tag
        env:
          VERSION: ${{ inputs.version }}
          MERGED_COMMIT: ${{ needs.version.outputs.commit }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          target="${MERGED_COMMIT:-HEAD}"
          git tag "${VERSION}" "${target}"
          git push origin "refs/tags/${VERSION}"

          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse "${target}")" >> "$GITHUB_OUTPUT"

  release:
    name: Create GitHub release
    needs: tag
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: write
    # Zulip release announcements are disabled until 1.0.0.
    # env:
    #   ZULIP_BOT_EMAIL: ${{ secrets.ZULIP_BOT_EMAIL }}
    #   ZULIP_BOT_API_KEY: ${{ secrets.ZULIP_BOT_API_KEY }}
    #   ZULIP_SITE: ${{ secrets.ZULIP_SITE }}

    steps:
      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: v${{ inputs.version }}
          generate_release_notes: true
          tag_name: ${{ needs.tag.outputs.tag }}

      # - name: Fetch generated changelog
      #   id: changelog
      #   if: steps.create_release.outcome == 'success' && env.ZULIP_SITE != ''
      #   continue-on-error: true
