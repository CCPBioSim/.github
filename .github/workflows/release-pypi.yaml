name: Release PyPI

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and publish. In a dry run the default branch is built instead.
        required: true
        type: string
      python-version:
        description: Python version used to build the distributions.
        type: string
        default: "3.14"
      repository-url:
        description: Package index upload URL. Leave empty to publish to PyPI, or set it to test against TestPyPI.
        type: string
        default: ""
      dry-run:
        description: Build and check the distributions but do not publish them.
        type: boolean
        default: false
      timeout-minutes:
        description: Timeout for the job.
        type: number
        default: 20
    secrets:
      PYPI_API_TOKEN:
        description: PyPI API token for the package.
        required: true

permissions:
  contents: read

jobs:
  pypi:
    name: Publish
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.dry-run && github.event.repository.default_branch || inputs.tag }}

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build==1.6.1 twine==7.0.0

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Publish to PyPI
        if: ${{ !inputs.dry-run }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
          REPOSITORY_URL: ${{ inputs.repository-url }}
        run: |
          if [ -n "${REPOSITORY_URL}" ]; then
            export TWINE_REPOSITORY_URL="${REPOSITORY_URL}"
          fi
          python -m twine upload dist/*
