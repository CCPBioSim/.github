name: C++ coverage upload
description: >-
  Turn gcov coverage data into an lcov report with gcovr and upload it to
  Coveralls as a named parallel build. The caller builds the instrumented
  binaries and runs the tests first. Close the parallel build afterwards with
  the ci-coveralls-finish workflow.

inputs:
  filters:
    description: gcovr filters, one regular expression per line, selecting the source files to report.
    required: true
  flag-name:
    description: Name for this coverage report in Coveralls.
    required: true
  root:
    description: gcovr root directory.
    default: "."
  gcovr-args:
    description: Extra arguments passed to gcovr.
    default: ""

runs:
  using: composite
  steps:
    - name: Install gcovr
      shell: bash
      run: python -m pip install gcovr==8.7

    - name: Generate lcov report
      shell: bash
      env:
        ROOT: ${{ inputs.root }}
        FILTERS: ${{ inputs.filters }}
        GCOVR_ARGS: ${{ inputs.gcovr-args }}
      run: |
        filter_args=()
        while IFS= read -r filter; do
          if [ -n "${filter}" ]; then
            filter_args+=(--filter "${filter}")
          fi
        done <<< "${FILTERS}"
        python -m gcovr --root "${ROOT}" "${filter_args[@]}" ${GCOVR_ARGS} --lcov coverage.info

    - name: Upload coverage to Coveralls
      uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
      with:
        github-token: ${{ github.token }}
        path-to-lcov: coverage.info
        flag-name: ${{ inputs.flag-name }}
        parallel: true
        fail-on-error: false
